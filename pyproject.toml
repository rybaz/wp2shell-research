[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wp2shell"
version = "2.0.0"
description = "Research PoC for CVE-2026-63030 + CVE-2026-60137 (WordPress REST batch handler-desync + WP_Query SQLi)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Empiric Security", email = "contact@empiricsecurity.com" }]
keywords = ["wordpress", "cve-2026-63030", "cve-2026-60137", "rest-api", "sqli", "security-research"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []  # standard library only

[project.scripts]
wp2shell = "wp2shell.cli:main"

[project.urls]
Documentation = "docs/USAGE.md"

[tool.setuptools.packages.find]
where = ["src"]
